function renderMfConstellation(svgEl) {
  const { width, height } = getMfCanvasSize();
  const cx = width / 2;
  const cy = height / 2;
  const baseR = Math.min(width, height) * 0.43;
  const rBank = Math.max(88, baseR * 0.34);
  const rAmc = Math.max(158, baseR * 0.61);
  const rFundMin = Math.max(222, baseR * 0.85);
  const rFundSpan = Math.max(46, baseR * 0.24);

  mfSvgZoom = d3.zoom().scaleExtent([0.35, 3.8]).on("zoom", ev => {
    if (mfZoomGroup) mfZoomGroup.attr("transform", ev.transform);
  });
  svgEl.call(mfSvgZoom);
  svgEl.on("click", () => { /* keep inspector open */ });

  const defs = svgEl.append("defs");
  const glow = defs.append("filter").attr("id", "mf-glow").attr("x", "-40%").attr("y", "-40%").attr("width", "180%").attr("height", "180%");
  glow.append("feGaussianBlur").attr("stdDeviation", "3.5").attr("result", "coloredBlur");
  const merge = glow.append("feMerge");
  merge.append("feMergeNode").attr("in", "coloredBlur");
  merge.append("feMergeNode").attr("in", "SourceGraphic");

  mfZoomGroup = svgEl.append("g");

  // Orbital guide rings
  [
    { r: rBank,    lbl: "ORBIT 1 • TOP 15 BANKS & quant" },
    { r: rAmc,     lbl: "ORBIT 2 • ASSOCIATED AMCs (SIZED BY AAUM)" },
    { r: rFundMin + rFundSpan * 0.45, lbl: `ORBIT 3 • 91 EQUITY SCHEMES (RADIUS & COLOR = ${mfHorizonLabel(mfHorizon)})` }
  ].forEach(ring => {
    mfZoomGroup.append("circle")
      .attr("cx", cx).attr("cy", cy).attr("r", ring.r)
      .attr("fill", "none")
      .attr("stroke", "#1e293b")
      .attr("stroke-dasharray", "3,5")
      .attr("stroke-width", 1);
    mfZoomGroup.append("text")
      .attr("x", cx).attr("y", cy - ring.r - 5)
      .attr("text-anchor", "middle")
      .attr("fill", "#475569")
      .attr("font-size", "8.5px")
      .attr("font-weight", "700")
      .attr("letter-spacing", "0.7px")
      .text(ring.lbl);
  });

  // Core hub
  mfZoomGroup.append("circle").attr("cx", cx).attr("cy", cy).attr("r", 34)
    .attr("fill", "#0f172a").attr("stroke", "#334155").attr("stroke-width", 1.5);
  mfZoomGroup.append("text").attr("x", cx).attr("y", cy - 4).attr("text-anchor", "middle")
    .attr("fill", "#e2e8f0").attr("font-size", "10px").attr("font-weight", "700").text("TOP 15 BANKS");
  mfZoomGroup.append("text").attr("x", cx).attr("y", cy + 10).attr("text-anchor", "middle")
    .attr("fill", "#f59e0b").attr("font-size", "9.5px").attr("font-weight", "700").text("+ quant MF");

  // Ordered AMCs along ring for balanced angular layout around their sponsoring banks
  const amcOrder = [
    "HDFC MF", "ICICI Pru MF", "Axis MF", "Kotak MF",
    "quant", "Invesco MF", "WhiteOak MF", "LIC MF",
    "BOI MF", "Union MF", "Canara Robeco MF", "Baroda BNP MF",
    "UTI MF", "SBI MF"
  ];
  const nAmc = amcOrder.length;
  const amcAngle = {};
  amcOrder.forEach((a, i) => {
    amcAngle[a] = -Math.PI / 2 + (i / nAmc) * Math.PI * 2;
  });

  // Distributor-only banks sit neatly between Private/JV & PSU sectors so no clutter
  const bankNodes = MF_TOP15_BANKS.map((b, idx) => {
    let ang;
    if (b.amcs.length === 1) {
      ang = amcAngle[b.amcs[0]];
    } else if (b.amcs.length > 1) {
      // average angles cleanly across its AMCs (SBI & BoB link both own AMC + UTI MF)
      const a0 = amcAngle[b.amcs[0]];
      const a1 = amcAngle[b.amcs[1]];
      ang = a0 * 0.72 + a1 * 0.28;
    } else {
      const distIdx = ["INDIANBANK", "FEDERALBNK", "CBI", "IOB"].indexOf(b.id);
      ang = -Math.PI * 0.12 + distIdx * 0.14;
    }
    const r = b.amcs.length === 0 ? rBank * 0.76 : rBank;
    return {
      nid: "bank:" + b.id,
      kind: "bank",
      data: b,
      group: b.group,
      x: cx + Math.cos(ang) * r,
      y: cy + Math.sin(ang) * r,
      ang,
      radius: b.id === "QUANT" ? 13 : (b.amcs.length ? 11.5 : 8.5),
      color: MF_GROUP_META[b.group].color,
      label: b.short
    };
  });

  const amcNodes = amcOrder.map(short => {
    const m = MF_AMC_META[short];
    const ang = amcAngle[short];
    const rad = Math.max(10, Math.min(24, 9 + Math.sqrt(m.aaumCr / 10000) * 1.25));
    return {
      nid: "amc:" + short,
      kind: "amc",
      data: { short, ...m },
      group: m.group,
      x: cx + Math.cos(ang) * rAmc,
      y: cy + Math.sin(ang) * rAmc,
      ang,
      radius: rad,
      color: MF_GROUP_META[m.group].color,
      label: short
    };
  });

  // Schemes fan cleanly within each AMC's angular wedge; distance encodes Horizon CAGR!
  const fundNodes = [];
  const wedge = (Math.PI * 2) / nAmc;
  const maxCagrScale = d3.scaleLinear().domain([-5, 25]).range([0, rFundSpan]).clamp(true);

  amcOrder.forEach(short => {
    const baseA = amcAngle[short];
    const list = MF_FUNDS.filter(f => f.shortAmc === short)
      .sort((a, b) => (b[mfHorizon] ?? -99) - (a[mfHorizon] ?? -99));
    const k = list.length;
    list.forEach((f, idx) => {
      const spread = k > 1 ? ((idx / (k - 1)) - 0.5) * wedge * 0.80 : 0;
      const ang = baseA + spread;
      const val = f[mfHorizon];
      const radOut = rFundMin + (val != null ? maxCagrScale(val) : rFundSpan * 0.2);
      const nodeRad = val != null ? Math.max(5.5, Math.min(11, 5.8 + Math.max(val, 0) * 0.22)) : 5.5;
      fundNodes.push({
        nid: "fund:" + f.code,
        kind: "fund",
        data: f,
        group: f.group,
        x: cx + Math.cos(ang) * radOut,
        y: cy + Math.sin(ang) * radOut,
        ang,
        radius: nodeRad,
        color: mfCagrColor(val),
        label: f.cat
      });
    });
  });

  const allNodes = [...bankNodes, ...amcNodes, ...fundNodes];
  const nodeByNid = new Map(allNodes.map(n => [n.nid, n]));

  const edges = [];
  bankNodes.forEach(bn => {
    bn.data.amcs.forEach(amcShort => {
      const an = nodeByNid.get("amc:" + amcShort);
      if (an) edges.push({ source: bn, target: an, kind: "bank-amc", color: bn.color });
    });
  });
  fundNodes.forEach(fn => {
    const an = nodeByNid.get("amc:" + fn.data.shortAmc);
    if (an) edges.push({ source: an, target: fn, kind: "amc-fund", color: an.color });
  });

  const curvePath = d => {
    const mx = (d.source.x + d.target.x) / 2;
    const my = (d.source.y + d.target.y) / 2;
    const pull = d.kind === "bank-amc" ? 0.86 : 0.94;
    const cpx = cx + (mx - cx) * pull;
    const cpy = cy + (my - cy) * pull;
    return `M${d.source.x},${d.source.y} Q${cpx},${cpy} ${d.target.x},${d.target.y}`;
  };

  constLinkSel = mfZoomGroup.append("g")
    .selectAll("path")
    .data(edges)
    .join("path")
    .attr("d", curvePath)
    .attr("fill", "none")
    .attr("stroke", d => d.color)
    .attr("stroke-width", d => d.kind === "bank-amc" ? 1.8 : 1.0)
    .attr("stroke-opacity", d => d.kind === "bank-amc" ? 0.55 : 0.35);

  constNodesSel = mfZoomGroup.append("g")
    .selectAll("g")
    .data(allNodes)
    .join("g")
    .attr("transform", d => `translate(${d.x},${d.y})`)
    .style("cursor", "pointer")
    .on("mouseover", (ev, d) => handleMfNodeHover(ev, d, edges))
    .on("mouseout", () => { hideTooltip(); updateConstellationHighlight(); })
    .on("click", (ev, d) => {
      ev.stopPropagation();
      const id = d.kind === "bank" ? d.data.id : (d.kind === "amc" ? d.data.short : d.data.code);
      selectMfItem(d.kind, String(id));
    });

  constNodesSel.append("circle")
    .attr("r", d => d.radius)
    .attr("fill", d => d.color)
    .attr("fill-opacity", d => d.kind === "fund" ? 0.92 : 0.25)
    .attr("stroke", d => d.kind === "fund" && mfRaceCodes.includes(d.data.code) ? "#fef08a" : d.color)
    .attr("stroke-width", d => d.kind === "amc" ? 2.2 : (d.kind === "bank" ? 2 : (mfRaceCodes.includes(d.data.code) ? 2.2 : 1.2)))
    .attr("stroke-dasharray", d => d.group === "distributor" ? "3,2" : null)
    .attr("filter", d => (d.kind === "fund" && (d.data[mfHorizon] ?? 0) >= 17) || d.nid === "bank:QUANT" ? "url(#mf-glow)" : null);

  // Inner dot inside banks & AMCs
  constNodesSel.filter(d => d.kind !== "fund")
    .append("circle")
    .attr("r", d => d.kind === "amc" ? 4.2 : 3.5)
    .attr("fill", d => d.color);

  // Smart Labels
  constNodesSel.append("text")
    .attr("dy", d => d.kind === "fund" ? (d.ang > 0 && d.ang < Math.PI ? d.radius + 10 : -(d.radius + 5)) : d.radius + 11)
    .attr("text-anchor", "middle")
    .attr("font-size", d => d.kind === "amc" ? "9.5px" : (d.kind === "bank" ? "8.5px" : "7.2px"))
    .attr("font-weight", d => d.kind === "fund" ? "500" : "700")
    .attr("fill", d => d.kind === "amc" ? "#f1f5f9" : (d.kind === "bank" ? "#cbd5e1" : "#94a3b8"))
    .style("pointer-events", "none")
    .style("text-shadow", "0 1px 4px rgba(0,0,0,0.95)")
    .text(d => {
      if (d.kind === "fund") {
        const v = d.data[mfHorizon];
        return `${d.data.cat.replace("Large & Mid Cap", "L&M").replace("Value / Contra", "Val")}${v != null ? " " + v.toFixed(0) + "%" : ""}`;
      }
      return d.label;
    });

  updateConstellationHighlight();
}

function getFilteredNidSet() {
  const filteredFunds = mfGetFilteredFunds();
  const visible = new Set();
  filteredFunds.forEach(f => {
    visible.add("fund:" + f.code);
    visible.add("amc:" + f.shortAmc);
    (MF_AMC_META[f.shortAmc]?.bankIds || []).forEach(bid => visible.add("bank:" + bid));
  });
  if (mfGroupFilter === "distributor" || mfGroupFilter === "all") {
    MF_TOP15_BANKS.filter(b => b.amcs.length === 0).forEach(b => {
      if (mfBankFilter === "all" || mfBankFilter === b.id) visible.add("bank:" + b.id);
    });
  }
  return visible;
}

function updateConstellationHighlight() {
  if (!constNodesSel || !constLinkSel) return;
  const vis = getFilteredNidSet();
  const selNid = mfSelected ? `${mfSelected.type}:${mfSelected.id}` : null;

  // Determine focus set if user selected a Bank or AMC explicitly
  let focusSet = null;
  if (selNid) {
    focusSet = new Set([selNid]);
    const [kind, rawId] = selNid.split(":");
    if (kind === "bank") {
      const b = MF_TOP15_BANKS.find(x => x.id === rawId);
      if (b) {
        b.amcs.forEach(a => {
          focusSet.add("amc:" + a);
          MF_FUNDS.filter(f => f.shortAmc === a).forEach(f => focusSet.add("fund:" + f.code));
        });
      }
    } else if (kind === "amc") {
      (MF_AMC_META[rawId]?.bankIds || []).forEach(bid => focusSet.add("bank:" + bid));
      MF_FUNDS.filter(f => f.shortAmc === rawId).forEach(f => focusSet.add("fund:" + f.code));
    } else if (kind === "fund") {
      const f = mfFundByCode(rawId);
      if (f) {
        focusSet.add("amc:" + f.shortAmc);
        (MF_AMC_META[f.shortAmc]?.bankIds || []).forEach(bid => focusSet.add("bank:" + bid));
      }
    }
  }

  const filterActive = (mfGroupFilter !== "all" || mfBankFilter !== "all" || mfCatFilter !== "all" || mfSearchTerm.trim() !== "");

  constNodesSel.style("opacity", d => {
    if (filterActive && !vis.has(d.nid)) return 0.1;
    if (focusSet && mfSelected.type !== "fund" && !focusSet.has(d.nid)) return 0.18;
    return 1;
  });
  constNodesSel.select("circle")
    .attr("stroke-width", d => d.nid === selNid ? 3.5 : (d.kind === "amc" ? 2.2 : (d.kind === "bank" ? 2 : (mfRaceCodes.includes(d.data.code) ? 2.2 : 1.2))));

  constLinkSel.attr("stroke-opacity", l => {
    const bothVis = vis.has(l.source.nid) && vis.has(l.target.nid);
    if (filterActive && !bothVis) return 0.04;
    if (focusSet) {
      return (focusSet.has(l.source.nid) && focusSet.has(l.target.nid)) ? 0.92 : 0.08;
    }
    return l.kind === "bank-amc" ? 0.55 : 0.34;
  }).attr("stroke-width", l => (focusSet && focusSet.has(l.source.nid) && focusSet.has(l.target.nid)) ? 2.4 : (l.kind === "bank-amc" ? 1.8 : 1));
}

function handleMfNodeHover(event, d, edges) {
  let title = "", sub = "";
  if (d.kind === "bank") {
    title = `🏦 ${d.data.name}`;
    sub = `${d.data.assetRank} • ${d.data.size} • AMCs: ${d.data.amcs.length ? d.data.amcs.join(", ") : "Distributor only"}`;
  } else if (d.kind === "amc") {
    title = `${d.data.full}`;
    sub = `${d.data.aaumText} • Linked to: ${d.data.bankIds.join(", ")}`;
  } else {
    const f = d.data;
    title = `${f.shortName}`;
    sub = `${f.shortAmc} • ${f.cat} | NAV ₹${f.nav} | 1Y: ${mfFmtPct(f.c1)} | 3Y: ${mfFmtPct(f.c3)} | 5Y: ${mfFmtPct(f.c5)} | Vol: ${f.vol ?? "N/A"}%`;
  }
  showTooltip(event, title, sub);
}

// ════════════════════════════════════════════════════════════
//  LENS 2: RISK VS RETURN GALAXY (QUADRANT + PARETO FRONTIER)
// ════════════════════════════════════════════════════════════
function renderMfGalaxy(svgEl) {
  const { width, height } = getMfCanvasSize();
  const margin = { top: 44, right: 34, bottom: 52, left: 60 };
  const iw = width - margin.left - margin.right;
  const ih = height - margin.top - margin.bottom;

  const allCandidates = mfGetFilteredFunds();
  const pts = allCandidates.filter(f => f.vol != null && f[mfHorizon] != null);

  const root = svgEl.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  if (!pts.length) {
    root.append("text").attr("x", iw / 2).attr("y", ih / 2).attr("text-anchor", "middle")
      .attr("fill", "#94a3b8").attr("font-size", "13px")
      .text("No funds have full " + mfHorizonLabel(mfHorizon) + " + volatility data for this filter. Try switching to 3Y or 1Y.");
    return;
  }

  const xExt = d3.extent(pts, d => d.vol);
  const yExt = d3.extent(pts, d => d[mfHorizon]);
  const xPad = Math.max(0.8, (xExt[1] - xExt[0]) * 0.12);
  const yPad = Math.max(1.5, (yExt[1] - yExt[0]) * 0.14);

  const x = d3.scaleLinear().domain([Math.max(8, xExt[0] - xPad), xExt[1] + xPad]).range([0, iw]).nice();
  const y = d3.scaleLinear().domain([Math.min(yExt[0] - yPad, 0), yExt[1] + yPad]).range([ih, 0]).nice();

  // Subtle grid
  root.append("g").attr("stroke", "#1e293b").attr("stroke-opacity", 0.7)
    .call(d3.axisLeft(y).tickSize(-iw).tickFormat(""))
    .select(".domain").remove();
  root.append("g").attr("stroke", "#1e293b").attr("stroke-opacity", 0.7).attr("transform", `translate(0,${ih})`)
    .call(d3.axisBottom(x).tickSize(-ih).tickFormat(""))
    .select(".domain").remove();

  // Axes
  root.append("g").attr("transform", `translate(0,${ih})`)
    .call(d3.axisBottom(x).ticks(7).tickFormat(v => v + "%"))
    .selectAll("text").attr("fill", "#94a3b8").attr("font-size", "10.5px");
  root.append("g")
    .call(d3.axisLeft(y).ticks(7).tickFormat(v => v + "%"))
    .selectAll("text").attr("fill", "#94a3b8").attr("font-size", "10.5px");
  root.selectAll(".domain, .tick line").attr("stroke", "#334155");

  // Axis titles
  root.append("text").attr("x", iw / 2).attr("y", ih + 38).attr("text-anchor", "middle")
    .attr("fill", "#94a3b8").attr("font-size", "11px").attr("font-weight", "600")
    .text("3-Year Annualized Volatility (Risk %, from Monthly AMFI NAV Returns) →");
  root.append("text").attr("transform", "rotate(-90)").attr("x", -ih / 2).attr("y", -44).attr("text-anchor", "middle")
    .attr("fill", "#94a3b8").attr("font-size", "11px").attr("font-weight", "600")
    .text(`${mfHorizonLabel(mfHorizon)} (%) ↑`);

  // Medians for quadrants
  const medX = d3.median(pts, d => d.vol);
  const medY = d3.median(pts, d => d[mfHorizon]);
  root.append("line").attr("x1", x(medX)).attr("x2", x(medX)).attr("y1", 0).attr("y2", ih)
    .attr("stroke", "#475569").attr("stroke-dasharray", "5,4").attr("stroke-width", 1.2);
  root.append("line").attr("x1", 0).attr("x2", iw).attr("y1", y(medY)).attr("y2", y(medY))
    .attr("stroke", "#475569").attr("stroke-dasharray", "5,4").attr("stroke-width", 1.2);

  // Quadrant badges
  const qLabels = [
    { x: 10,     y: 16,     anchor: "start", color: "#34d399", text: "★ SWEET SPOT (HIGH RETURN • LOWER RISK)" },
    { x: iw - 8, y: 16,     anchor: "end",   color: "#fbbf24", text: "🚀 HIGH-OCTANE ALPHA (HIGH VOLATILITY)" },
    { x: 10,     y: ih - 8, anchor: "start", color: "#38bdf8", text: "🛡️ DEFENSIVE / LOWER VOL" },
    { x: iw - 8, y: ih - 8, anchor: "end",   color: "#f87171", text: "▽ HIGHER RISK / LAGGING" }
  ];
  qLabels.forEach(ql => {
    root.append("text").attr("x", ql.x).attr("y", ql.y).attr("text-anchor", ql.anchor)
      .attr("fill", ql.color).attr("fill-opacity", 0.72).attr("font-size", "9.5px").attr("font-weight", "700")
      .text(ql.text);
  });

  // Pareto Efficiency Frontier (max return as volatility increases from lowest vol up to max return)
  const sortedByVol = pts.slice().sort((a, b) => a.vol - b.vol || b[mfHorizon] - a[mfHorizon]);
  const frontier = [];
  let bestSoFar = -Infinity;
  sortedByVol.forEach(p => {
    if (p[mfHorizon] > bestSoFar) {
      frontier.push(p);
      bestSoFar = p[mfHorizon];
    }
  });
  if (frontier.length >= 2) {
    root.append("path")
      .datum(frontier)
      .attr("d", d3.line().x(d => x(d.vol)).y(d => y(d[mfHorizon])).curve(d3.curveMonotoneX))
      .attr("fill", "none")
      .attr("stroke", "#34d399")
      .attr("stroke-width", 1.6)
      .attr("stroke-dasharray", "4,4")
      .attr("opacity", 0.7);
  }

  // Coverage note when 5Y hides newer schemes
  if (pts.length < allCandidates.length) {
    root.append("text").attr("x", iw - 8).attr("y", -14).attr("text-anchor", "end")
      .attr("fill", "#94a3b8").attr("font-size", "10.5px")
      .text(`Showing ${pts.length} of ${allCandidates.length} filtered schemes with full ${mfHorizon.toUpperCase()} AMFI history`);
  }

  // Bubbles
  const frontierSet = new Set(frontier.map(f => f.code));
  const rScale = d3.scaleSqrt().domain([15000, 1310000]).range([5.5, 16]).clamp(true);

  const dots = root.append("g").selectAll("g").data(pts).join("g")
    .attr("transform", d => `translate(${x(d.vol)},${y(d[mfHorizon])})`)
    .style("cursor", "pointer")
    .on("mouseover", (ev, d) => {
      showTooltip(ev, d.shortName, `${d.shortAmc} (${d.bank}) • ${d.cat} | ${mfHorizonLabel(mfHorizon)}: ${mfFmtPct(d[mfHorizon])} | Vol: ${d.vol.toFixed(1)}% | MaxDD: ${d.mdd}%`);
    })
    .on("mouseout", hideTooltip)
    .on("click", (ev, d) => { ev.stopPropagation(); selectMfItem("fund", String(d.code)); });

  dots.append("circle")
    .attr("r", d => rScale(d.aaumCr))
    .attr("fill", d => d.groupColor)
    .attr("fill-opacity", d => (mfSelected.type === "fund" && mfSelected.id === String(d.code)) ? 0.95 : 0.72)
    .attr("stroke", d => (mfSelected.type === "fund" && mfSelected.id === String(d.code)) ? "#ffffff" : (mfRaceCodes.includes(d.code) ? "#fde047" : d.groupColor))
    .attr("stroke-width", d => (mfSelected.type === "fund" && mfSelected.id === String(d.code)) ? 2.8 : (mfRaceCodes.includes(d.code) ? 2 : 1));

  // Label top leaders, Pareto frontier & quant schemes
  const topLeaderCodes = new Set(pts.slice().sort((a, b) => b[mfHorizon] - a[mfHorizon]).slice(0, 5).map(d => d.code));
  dots.filter(d => frontierSet.has(d.code) || topLeaderCodes.has(d.code) || d.group === "quant" || (mfSelected.type === "fund" && mfSelected.id === String(d.code)))
    .append("text")
    .attr("dy", d => -(rScale(d.aaumCr) + 5))
    .attr("text-anchor", "middle")
    .attr("fill", d => d.group === "quant" ? "#fde68a" : "#e2e8f0")
    .attr("font-size", "9px")
    .attr("font-weight", "600")
    .style("pointer-events", "none")
    .style("text-shadow", "0 1px 4px rgba(0,0,0,0.95)")
    .text(d => `${d.shortAmc.replace(" MF", "")} ${d.cat.replace("Large & Mid Cap", "L&M").replace("Value / Contra", "Val")}`);
}

// ════════════════════════════════════════════════════════════
//  LENS 3: ₹10,000 WEALTH GROWTH RACE (REAL MONTHLY NAVS)
// ════════════════════════════════════════════════════════════
function renderMfRace(svgEl) {
  const { width, height } = getMfCanvasSize();
  const margin = { top: 44, right: 155, bottom: 48, left: 66 };
  const iw = Math.max(width - margin.left - margin.right, 160);
  const ih = Math.max(height - margin.top - margin.bottom, 160);
  const monthsBack = mfHorizon === "c1" ? 12 : (mfHorizon === "c3" ? 36 : 60);

  const root = svgEl.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const raceFunds = mfRaceCodes.map(c => mfFundByCode(c)).filter(Boolean);
  if (!raceFunds.length) {
    root.append("text").attr("x", iw / 2).attr("y", ih / 2).attr("text-anchor", "middle").attr("fill", "#94a3b8")
      .text("Check any schemes in the left sidebar to race ₹10,000 invested over " + mfHorizon.toUpperCase() + ".");
    return;
  }

  // Determine common anchor month (~T - monthsBack from 2026-11)
  const latestAll = raceFunds.map(f => f.pts[f.pts.length - 1][0]).sort().pop() || "2026-11";
  const [endY, endM] = latestAll.split("-").map(Number);
  const anchorDt = new Date(endY, endM - 1 - monthsBack, 1);
  const anchorYM = `${anchorDt.getFullYear()}-${String(anchorDt.getMonth() + 1).padStart(2, "0")}`;

  const tracks = [];
  const skippedYoung = [];

  raceFunds.forEach((f, idx) => {
    const color = MF_RACE_PALETTE[idx % MF_RACE_PALETTE.length];
    const eligiblePts = f.pts.filter(p => p[0] >= anchorYM);
    if (!eligiblePts.length) {
      skippedYoung.push(f);
      return;
    }
    const [sy, sm] = eligiblePts[0][0].split("-").map(Number);
    const [ay, am] = anchorYM.split("-").map(Number);
    const lagMonths = (sy - ay) * 12 + (sm - am);
    if (lagMonths > 2) {
      skippedYoung.push(f);
      return;
    }
    const baseNav = eligiblePts[0][1];
    const values = eligiblePts.map(p => ({
      m: p[0],
      dt: new Date(p[0] + "-01"),
      val: (p[1] / baseNav) * 10000
    }));
    tracks.push({ fund: f, color, values, finalVal: values[values.length - 1].val });
  });

  if (!tracks.length) {
    root.append("text").attr("x", iw / 2).attr("y", ih / 2).attr("text-anchor", "middle").attr("fill", "#94a3b8")
      .text("Selected schemes launched less than " + (monthsBack / 12) + " years ago. Switch Horizon to 3Y or 1Y!");
    return;
  }

  const allDates = tracks.flatMap(t => t.values.map(v => v.dt));
  const allVals = tracks.flatMap(t => t.values.map(v => v.val));
  const x = d3.scaleTime().domain(d3.extent(allDates)).range([0, iw]);
  const y = d3.scaleLinear().domain([Math.min(9200, d3.min(allVals) * 0.96), d3.max(allVals) * 1.07]).range([ih, 0]).nice();

  // Horizontal grid + principal ₹10,000 line
  root.append("g").attr("stroke", "#1e293b").attr("stroke-opacity", 0.75)
    .call(d3.axisLeft(y).tickSize(-iw).tickFormat(""))
    .select(".domain").remove();

  root.append("line").attr("x1", 0).attr("x2", iw).attr("y1", y(10000)).attr("y2", y(10000))
    .attr("stroke", "#64748b").attr("stroke-dasharray", "5,4").attr("stroke-width", 1.2);

  root.append("g").attr("transform", `translate(0,${ih})`)
    .call(d3.axisBottom(x).ticks(Math.min(8, Math.floor(iw / 80))).tickFormat(d3.timeFormat("%b '%y")))
    .selectAll("text").attr("fill", "#94a3b8").attr("font-size", "10.5px");
  root.append("g")
    .call(d3.axisLeft(y).ticks(6).tickFormat(v => "₹" + Math.round(v).toLocaleString("en-IN")))
    .selectAll("text").attr("fill", "#94a3b8").attr("font-size", "10.5px");
  root.selectAll(".domain, .tick line").attr("stroke", "#334155");

  // Header caption inside chart
  root.append("text").attr("x", 4).attr("y", -18).attr("fill", "#cbd5e1").attr("font-size", "12px").attr("font-weight", "700")
    .text(`Growth of ₹10,000 Lumpsum (${anchorYM} → ${latestAll})`);
  if (skippedYoung.length) {
    root.append("text").attr("x", iw).attr("y", -18).attr("text-anchor", "end").attr("fill", "#fbbf24").attr("font-size", "10px")
      .text(`Omitted <${monthsBack / 12}Y history: ${skippedYoung.map(s => s.shortAmc).join(", ")}`);
  }

  // Leader area fill
  const leader = tracks.slice().sort((a, b) => b.finalVal - a.finalVal)[0];
  const area = d3.area().x(d => x(d.dt)).y0(ih).y1(d => y(d.val)).curve(d3.curveMonotoneX);
  root.append("path").datum(leader.values).attr("d", area).attr("fill", leader.color).attr("fill-opacity", 0.08);

  const line = d3.line().x(d => x(d.dt)).y(d => y(d.val)).curve(d3.curveMonotoneX);
  tracks.forEach(t => {
    root.append("path").datum(t.values).attr("d", line).attr("fill", "none")
      .attr("stroke", t.color).attr("stroke-width", t.fund.code === leader.fund.code ? 3 : 2.1)
      .attr("opacity", 0.92);
    const last = t.values[t.values.length - 1];
    root.append("circle").attr("cx", x(last.dt)).attr("cy", y(last.val)).attr("r", 3.8).attr("fill", t.color).attr("stroke", "#090d16").attr("stroke-width", 1.2);
  });

  // Collision-relaxed end labels on right margin
  const labelItems = tracks.map(t => ({
    t,
    rawY: y(t.finalVal),
    y: y(t.finalVal)
  })).sort((a, b) => a.rawY - b.rawY);
  for (let i = 1; i < labelItems.length; i++) {
    if (labelItems[i].y - labelItems[i - 1].y < 16) {
      labelItems[i].y = labelItems[i - 1].y + 16;
    }
  }
  labelItems.forEach(item => {
    const f = item.t.fund;
    const gLbl = root.append("g").style("cursor", "pointer").on("click", () => selectMfItem("fund", String(f.code)));
    gLbl.append("text").attr("x", iw + 8).attr("y", item.y + 4)
      .attr("fill", item.t.color).attr("font-size", "10.5px").attr("font-weight", "700")
      .text(`₹${Math.round(item.t.finalVal).toLocaleString("en-IN")} • ${f.shortAmc} ${f.cat.replace("Large & Mid Cap", "L&M")}`);
  });

  // Interactive Scrubbing Crosshair
  const focusLine = root.append("line").attr("y1", 0).attr("y2", ih)
    .attr("stroke", "#94a3b8").attr("stroke-dasharray", "3,3").style("display", "none");

  const monthList = [...new Set(tracks.flatMap(t => t.values.map(v => v.m)))].sort();
  root.append("rect").attr("width", iw).attr("height", ih).attr("fill", "transparent")
    .style("cursor", "crosshair")
    .on("mousemove", ev => {
      const [mx] = d3.pointer(ev);
      const hoverDt = x.invert(mx);
      let bestM = monthList[0];
      let bestDiff = Infinity;
      monthList.forEach(m => {
        const diff = Math.abs(new Date(m + "-01") - hoverDt);
        if (diff < bestDiff) { bestDiff = diff; bestM = m; }
      });
      const cxPos = x(new Date(bestM + "-01"));
      focusLine.style("display", "block").attr("x1", cxPos).attr("x2", cxPos);

      const rows = tracks.map(t => {
        const pt = t.values.find(v => v.m === bestM);
        return pt ? { name: `${t.fund.shortAmc} ${t.fund.cat}`, val: pt.val, color: t.color } : null;
      }).filter(Boolean).sort((a, b) => b.val - a.val);

      const info = rows.map(r => `${r.name}: ₹${Math.round(r.val).toLocaleString("en-IN")}`).join("  |  ");
      showTooltip(ev, `Month ${bestM} Leaderboard`, info);
    })
    .on("mouseout", () => {
      focusLine.style("display", "none");
      hideTooltip();
    });
}

function showTooltip(event, title, sub) {
  tooltip.style.display = "block";
  tooltip.querySelector(".tt-name").textContent = title;
  tooltip.querySelector(".tt-info").textContent = sub;
  const x = Math.min(event.clientX + 16, window.innerWidth - 295);
  const y = Math.min(event.clientY - 12, window.innerHeight - 110);
  tooltip.style.left = x + "px";
  tooltip.style.top = Math.max(8, y) + "px";
}

function hideTooltip() {
  tooltip.style.display = "none";
}

function fmtFinValue(val, unit, cur, compact = true) {
  if (val == null || Number.isNaN(val)) return "N/A";
  const sign = val < 0 ? "-" : "";
  const abs = Math.abs(val);
  if (unit === "INR_CR") {
    if (compact && abs >= 100000) return `${sign}₹${(abs / 100000).toFixed(2)}L Cr`;
    if (compact && abs >= 1000) return `${sign}₹${Math.round(abs).toLocaleString("en-IN")} Cr`;
    return `${sign}₹${abs.toFixed(0)} Cr`;
  }
  const symMap = { USD: "$", EUR: "€", GBP: "£", TWD: "NT$", JPY: "¥", KRW: "₩", CNY: "¥", CHF: "CHF ", AUD: "A$", SGD: "S$", SAR: "SAR ", DKK: "DKK " };
  const sym = symMap[cur] || (cur + " ");
  // Base unit in JSON for non-India is Millions
  if (abs >= 1000000) return `${sign}${sym}${(abs / 1000000).toFixed(2)}T`;
  if (abs >= 1000) return `${sign}${sym}${(abs / 1000).toFixed(1)}B`;
  return `${sign}${sym}${Math.round(abs)}M`;
}

function fmtAxisTick(val, unit, cur) {
  if (val === 0) return "0";
  const sign = val < 0 ? "-" : "";
  const abs = Math.abs(val);
  if (unit === "INR_CR") {
    if (abs >= 100000) return `${sign}${(abs / 100000).toFixed(1)}L`;
    if (abs >= 1000) return `${sign}${Math.round(abs / 1000)}k`;
    return `${sign}${Math.round(abs)}`;
  }
  if (abs >= 1000000) return `${sign}${(abs / 1000000).toFixed(1)}T`;
  if (abs >= 1000) return `${sign}${Math.round(abs / 1000)}B`;
  return `${sign}${Math.round(abs)}M`;
}

function buildFinSectionHtml(d) {
  const fd = typeof FIN_DATA !== "undefined" ? FIN_DATA[d.id] : null;
  if (!fd || !fd.rows || !fd.rows.length) {
    const isUnlisted = d.group === "unlisted" || d.listed === false || d.listing === "unlisted";
    if (isUnlisted) {
      return `<div class="fin-unlisted-note">Private / unlisted entity — public multi-year quarterly revenue &amp; profit filings are not published.</div>`;
    }
    return "";
  }

  const rows = fd.rows;
  const fullYears = rows.filter(r => !r.ytd);
  const ytdRow = rows.find(r => r.ytd);
  const latestFy = fullYears[fullYears.length - 1] || rows[rows.length - 1];
  const prevFy = fullYears.length >= 2 ? fullYears[fullYears.length - 2] : null;
  const unitLabel = fd.unit === "INR_CR" ? "INR (₹ Cr)" : `${fd.cur}`;

  let rightTileHtml = "";
  if (ytdRow) {
    const yMargin = ytdRow.r ? ((ytdRow.n / ytdRow.r) * 100).toFixed(1) + "%" : "N/A";
    rightTileHtml = `
      <div class="fin-kpi-pill ytd-highlight">
        <div class="fin-kpi-k">${ytdRow.p}</div>
        <div class="fin-kpi-v">${fmtFinValue(ytdRow.r, fd.unit, fd.cur)} <span style="color:#34d399">/ ${fmtFinValue(ytdRow.n, fd.unit, fd.cur)}</span></div>
        <div style="font-size:9px;color:#22d3ee;margin-top:1px;">Margin ${yMargin} (Partial FY)</div>
      </div>`;
  } else if (prevFy && prevFy.r > 0) {
    const rYoY = (((latestFy.r / prevFy.r) - 1) * 100);
    const nYoY = prevFy.n > 0 ? (((latestFy.n / prevFy.n) - 1) * 100) : null;
    rightTileHtml = `
      <div class="fin-kpi-pill">
        <div class="fin-kpi-k">${latestFy.p} YoY Growth</div>
        <div class="fin-kpi-v"><span style="color:${rYoY >= 0 ? "#60a5fa" : "#f87171"}">Rev ${rYoY >= 0 ? "+" : ""}${rYoY.toFixed(1)}%</span>${nYoY != null ? ` • <span style="color:${nYoY >= 0 ? "#34d399" : "#f87171"}">NI ${nYoY >= 0 ? "+" : ""}${nYoY.toFixed(1)}%</span>` : ""}</div>
        <div style="font-size:9px;color:var(--text-muted);margin-top:1px;">Full FY Closed</div>
      </div>`;
  }

  const fyMargin = latestFy.r ? ((latestFy.n / latestFy.r) * 100).toFixed(1) + "%" : "N/A";

  return `
    <div class="fin-card" id="fin-card-box">
      <div class="fin-card-hdr">
        <span class="fin-card-title">Revenue &amp; Net Profit (${rows.length > 1 ? fullYears.length + "Y" : "FY"}${ytdRow ? " + YTD" : ""})</span>
        <span class="fin-unit-badge">${unitLabel}</span>
      </div>
      <div class="fin-kpi-strip" style="${rightTileHtml ? "" : "grid-template-columns:1fr;"}">
        <div class="fin-kpi-pill">
          <div class="fin-kpi-k">${latestFy.p} (Full FY)</div>
          <div class="fin-kpi-v">${fmtFinValue(latestFy.r, fd.unit, fd.cur)} <span style="color:${latestFy.n >= 0 ? "#34d399" : "#f87171"}">/ ${fmtFinValue(latestFy.n, fd.unit, fd.cur)}</span></div>
          <div style="font-size:9px;color:var(--text-muted);margin-top:1px;">Net Margin ${fyMargin}</div>
        </div>
        ${rightTileHtml}
      </div>
      <svg id="fin-rev-profit-svg" viewBox="0 0 296 150" style="width:100%;height:150px;overflow:visible;"></svg>
      <div class="fin-legend-row">
        <div class="fin-leg-items">
          <span class="fin-leg-it"><span class="fin-swatch" style="background:#3b82f6"></span> Revenue</span>
          <span class="fin-leg-it"><span class="fin-swatch" style="background:#10b981"></span> Net Profit</span>
          ${ytdRow ? `<span class="fin-leg-it"><span class="fin-swatch" style="background:#06b6d4;border:1px dashed #67e8f9"></span> YTD</span>` : ""}
        </div>
        <span>${fd.basis}</span>
      </div>
    </div>
  `;
}

function renderFinChartSvg(d) {
  const fd = typeof FIN_DATA !== "undefined" ? FIN_DATA[d.id] : null;
  if (!fd || !fd.rows || !fd.rows.length) return;
  const svgEl = d3.select("#fin-rev-profit-svg");
  if (svgEl.empty()) return;
  svgEl.selectAll("*").remove();

  const rows = fd.rows;
  const margin = { top: 10, right: 8, bottom: 26, left: 38 };
  const w = 296 - margin.left - margin.right;
  const h = 150 - margin.top - margin.bottom;
  const g = svgEl.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const x0 = d3.scaleBand().domain(rows.map(r => r.p)).range([0, w]).paddingInner(0.24).paddingOuter(0.08);
  const x1 = d3.scaleBand().domain(["r", "n"]).range([0, x0.bandwidth()]).padding(0.12);

  const allVals = rows.flatMap(r => [r.r, r.n, 0]);
  const minVal = Math.min(0, d3.min(allVals));
  const maxVal = Math.max(1, d3.max(allVals) * 1.12);
  const y = d3.scaleLinear().domain([minVal, maxVal]).range([h, 0]).nice();

  // Gridlines
  g.append("g")
    .call(d3.axisLeft(y).ticks(4).tickSize(-w).tickFormat(""))
    .selectAll(".tick line").attr("stroke", "#1e293b").attr("stroke-dasharray", "2,3");
  g.selectAll(".domain").remove();

  // Y Axis labels
  g.append("g")
    .call(d3.axisLeft(y).ticks(4).tickSize(0).tickFormat(v => fmtAxisTick(v, fd.unit, fd.cur)))
    .selectAll("text").attr("fill", "#64748b").attr("font-size", "8.5px");
  g.select(".domain").remove();

  // Zero baseline
  const zeroY = y(0);
  g.append("line").attr("x1", 0).attr("x2", w).attr("y1", zeroY).attr("y2", zeroY).attr("stroke", "#334155").attr("stroke-width", 1);

  // Subtle highlight column behind YTD period
  rows.filter(r => r.ytd).forEach(r => {
    const bx = x0(r.p);
    g.append("rect")
      .attr("x", bx - 3).attr("y", -4)
      .attr("width", x0.bandwidth() + 6).attr("height", h + 6)
      .attr("rx", 4)
      .attr("fill", "rgba(6,182,212,0.08)")
      .attr("stroke", "rgba(6,182,212,0.28)")
      .attr("stroke-dasharray", "3,2");
  });

  // Grouped bars
  const groups = g.selectAll(".fin-grp")
    .data(rows)
    .join("g")
    .attr("class", "fin-grp")
    .attr("transform", r => `translate(${x0(r.p)},0)`);

  // Revenue bar
  groups.append("rect")
    .attr("x", x1("r"))
    .attr("y", r => r.r >= 0 ? y(r.r) : zeroY)
    .attr("width", x1.bandwidth())
    .attr("height", r => Math.max(1.5, Math.abs(y(r.r) - zeroY)))
    .attr("rx", 2)
    .attr("fill", r => r.ytd ? "#06b6d4" : "#3b82f6")
    .attr("fill-opacity", r => r.ytd ? 0.85 : 0.92);

  // Net Profit bar
  groups.append("rect")
    .attr("x", x1("n"))
    .attr("y", r => r.n >= 0 ? y(r.n) : zeroY)
    .attr("width", x1.bandwidth())
    .attr("height", r => Math.max(1.5, Math.abs(y(r.n) - zeroY)))
    .attr("rx", 2)
    .attr("fill", r => r.n < 0 ? "#ef4444" : (r.ytd ? "#2dd4bf" : "#10b981"))
    .attr("fill-opacity", r => r.ytd ? 0.85 : 0.92);

  // X Axis ticks (compact label keeping YTD clearly visible)
  g.append("g")
    .attr("transform", `translate(0,${h})`)
    .call(d3.axisBottom(x0).tickSize(0).tickFormat(lbl => lbl.replace(/\s*\((\d+M)\)/, "")))
    .selectAll("text")
    .attr("fill", lbl => String(lbl).includes("YTD") ? "#67e8f9" : "#94a3b8")
    .attr("font-weight", lbl => String(lbl).includes("YTD") ? "700" : "500")
    .attr("font-size", rows.length >= 6 ? "7.8px" : "8.6px")
    .attr("dy", "8px");
  g.selectAll(".domain").remove();

  // Hover hitbox per period for rich tooltip
  groups.append("rect")
    .attr("x", -2).attr("y", -4)
    .attr("width", x0.bandwidth() + 4).attr("height", h + 8)
    .attr("fill", "transparent")
    .style("cursor", "pointer")
    .on("mouseover", (ev, r) => {
      const m = r.r ? ((r.n / r.r) * 100).toFixed(1) + "%" : "N/A";
      const sub = `Revenue: ${fmtFinValue(r.r, fd.unit, fd.cur)}  |  Net Profit: ${fmtFinValue(r.n, fd.unit, fd.cur)}  |  Margin: ${m}`;
      showTooltip(ev, `${d.name} (${r.p})`, sub);
    })
    .on("mouseout", hideTooltip);
}


const hashMode = window.location.hash.replace("#", "").toLowerCase();
const initialMode = ["nifty", "nasdaq", "combined", "mf"].includes(hashMode) ? hashMode : "nifty";
switchIndex(initialMode);
</script>
