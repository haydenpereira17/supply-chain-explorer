<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Supply Chain Explorer — Nifty 50 &amp; Nasdaq-100</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --bg-dark: #090d16;
    --bg-panel: #111827;
    --bg-card: #1b2436;
    --bg-card-hover: #243047;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #3b82f6;
    --accent-glow: rgba(59,130,246,0.35);
    --border: #1e293b;
    --green: #10b981;
    --red: #ef4444;
    --amber: #f59e0b;
    --purple: #8b5cf6;
    --pink: #ec4899;
    --cyan: #06b6d4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-dark);
    color: var(--text-primary);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  #header {
    flex-shrink: 0;
    min-height: 54px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 14px;
    z-index: 100;
    flex-wrap: wrap;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex-wrap: wrap;
  }
  .pane-toggle {
    background: var(--bg-card);
    border: 1px solid #2b384e;
    color: var(--text-primary);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  .pane-toggle:hover { background: var(--bg-card-hover); border-color: var(--accent); }
  #header h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.3px;
    background: linear-gradient(135deg, #60a5fa, var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }

  /* ── INDEX SWITCHER TOGGLE ── */
  .index-switcher {
    display: inline-flex;
    background: var(--bg-dark);
    border: 1px solid #2b384e;
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
  }
  .index-tab {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .index-tab:hover { color: var(--text-primary); background: rgba(255,255,255,0.04); }
  .index-tab.active {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(59,130,246,0.35);
  }
  .index-tab[data-index="nasdaq"].active {
    background: linear-gradient(135deg, #0284c7, #06b6d4);
    box-shadow: 0 2px 8px rgba(6,182,212,0.35);
  }
  .index-tab[data-index="combined"].active {
    background: linear-gradient(135deg, #4f46e5, #06b6d4);
    box-shadow: 0 2px 8px rgba(99,102,241,0.35);
  }

  #header .stats {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    font-size: 11.5px;
    color: var(--text-secondary);
  }
  .stat-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--bg-card);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
    white-space: nowrap;
  }
  .stat-pill:hover { border-color: #334155; color: var(--text-primary); }
  .stat-pill.active-status { border-color: var(--accent); background: rgba(59,130,246,0.16); color: var(--text-primary); }
  .stat-pill.static { cursor: default; }
  .stat-pill.static:hover { border-color: transparent; color: var(--text-secondary); }
  .stat-pill .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── MAIN WORKSPACE ── */
  #workspace {
    flex: 1;
    display: flex;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }

  /* ── LEFT SIDEBAR ── */
  #sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 90;
    overflow: hidden;
  }
  #sidebar.collapsed { display: none; }
  #search-box {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  #search-box input {
    width: 100%;
    padding: 8px 11px;
    background: var(--bg-card);
    border: 1px solid #2b384e;
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 12.5px;
    outline: none;
    transition: border-color .2s;
  }
  #search-box input:focus { border-color: var(--accent); }
  #search-box input::placeholder { color: var(--text-muted); }

  #sector-filters {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    max-height: 215px;
    overflow-y: auto;
  }
  #sector-filters::-webkit-scrollbar { width: 4px; }
  #sector-filters::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

  .sector-btn {
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 10.5px;
    font-weight: 500;
    border: 1px solid #2b384e;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .sector-btn:hover { border-color: var(--accent); color: var(--text-primary); }
  .sector-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  #filter-row {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  #filter-row select {
    width: 100%;
    padding: 5px 8px;
    background: var(--bg-card);
    border: 1px solid #2b384e;
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 11.5px;
    outline: none;
    cursor: pointer;
  }
  #filter-row select option { background: var(--bg-card); }

  #company-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }
  #company-list::-webkit-scrollbar { width: 5px; }
  #company-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

  .list-section-header {
    padding: 6px 14px 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .company-item {
    padding: 8px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 9px;
    transition: background .15s;
    border-left: 3px solid transparent;
  }
  .company-item:hover { background: var(--bg-card); }
  .company-item.active {
    background: rgba(59,130,246,0.12);
    border-left-color: var(--accent);
  }
  .company-item .icon {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10.5px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .company-item .info { flex: 1; min-width: 0; }
  .company-item .name {
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .company-item .sector-label {
    font-size: 10.5px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .company-item .badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 8px;
    background: var(--bg-dark);
    color: var(--text-secondary);
    flex-shrink: 0;
  }

  /* ── GRAPH AREA ── */
  #graph-container {
    flex: 1;
    min-width: 0;
    height: 100%;
    position: relative;
    background: radial-gradient(circle at center, #0f1626 0%, var(--bg-dark) 75%);
    overflow: hidden;
  }
  svg { width: 100%; height: 100%; display: block; }
  .link { stroke-opacity: 0.32; transition: stroke-opacity .2s, stroke-width .2s; }
  .link:hover { stroke-opacity: 0.85; }
  .node circle { cursor: pointer; transition: r .2s, opacity .2s; }
  .node text {
    fill: var(--text-secondary);
    pointer-events: none;
    text-anchor: middle;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
  }
  .node.highlighted circle { filter: drop-shadow(0 0 10px var(--accent-glow)); }
  .node.dimmed { opacity: 0.11; }
  .link.dimmed { opacity: 0.025 !important; }
  .link.highlighted { stroke-opacity: 0.95 !important; stroke-width: 2.3px !important; }

  /* ── LEGEND & CONTROLS ── */
  #graph-hud-bottom {
    position: absolute;
    bottom: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px;
    pointer-events: none;
    z-index: 80;
  }
  #legend {
    pointer-events: auto;
    background: rgba(17,24,39,0.92);
    backdrop-filter: blur(8px);
    border: 1px solid #263248;
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    font-size: 11px;
    max-width: calc(100% - 170px);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-line { width: 16px; height: 2px; border-radius: 1px; flex-shrink: 0; }

  #graph-controls {
    pointer-events: auto;
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .ctrl-btn {
    height: 34px;
    min-width: 34px;
    padding: 0 9px;
    border-radius: 8px;
    background: rgba(17,24,39,0.92);
    backdrop-filter: blur(8px);
    border: 1px solid #263248;
    color: var(--text-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    transition: all .15s;
    white-space: nowrap;
  }
  .ctrl-btn:hover { background: var(--bg-card); color: var(--text-primary); border-color: var(--accent); }
  .ctrl-btn.active-mode { background: rgba(59,130,246,0.18); border-color: var(--accent); color: #93c5fd; }

  /* ── RIGHT DETAIL PANEL ── */
  #detail-panel {
    width: 330px;
    flex-shrink: 0;
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 90;
    overflow: hidden;
  }
  #detail-panel.collapsed { display: none; }
  .detail-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
  }
  .close-detail-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .close-detail-btn:hover { background: var(--bg-card); color: var(--text-primary); }

  #detail-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  #detail-content::-webkit-scrollbar { width: 5px; }
  #detail-content::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

  .detail-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .detail-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .detail-title { font-size: 15.5px; font-weight: 700; line-height: 1.25; }
  .detail-subtitle { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }

  .detail-section { margin-bottom: 18px; }
  .detail-section h3 {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .detail-tag {
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .tag-listed { background: rgba(16,185,129,0.14); color: var(--green); }
  .tag-unlisted { background: rgba(245,158,11,0.14); color: var(--amber); }
  .tag-nifty { background: rgba(59,130,246,0.16); color: #60a5fa; }
  .tag-ndx { background: rgba(6,182,212,0.16); color: #22d3ee; }
  .tag-intl { background: rgba(139,92,246,0.15); color: #a78bfa; }

  .supply-chain-item {
    padding: 8px 10px;
    margin-bottom: 5px;
    background: var(--bg-card);
    border-radius: 7px;
    border: 1px solid transparent;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all .15s;
    font-size: 12px;
  }
  .supply-chain-item:hover { background: var(--bg-card-hover); border-color: #334155; }
  .supply-chain-item .sc-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .supply-chain-item .sc-main { flex: 1; min-width: 0; }
  .supply-chain-item .sc-name {
    font-weight: 600;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .supply-chain-item .sc-sub {
    font-size: 10.5px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .supply-chain-item .sc-status {
    font-size: 9.5px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    padding: 28px;
  }
  .empty-state svg { width: 52px; height: 52px; margin-bottom: 14px; opacity: 0.35; }
  .empty-state p { color: var(--text-muted); font-size: 12.5px; line-height: 1.6; }

  /* ── TOOLTIP ── */
  #tooltip {
    position: fixed;
    background: rgba(17,24,39,0.96);
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 12px;
    pointer-events: none;
    z-index: 200;
    display: none;
    max-width: 270px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.55);
  }
  #tooltip .tt-name { font-weight: 700; margin-bottom: 3px; }
  #tooltip .tt-info { color: var(--text-secondary); font-size: 11px; line-height: 1.4; }

  @media (max-width: 1050px) {
    #sidebar {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: min(300px, 85vw);
      box-shadow: 8px 0 32px rgba(0,0,0,0.5);
    }
    #detail-panel {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: min(330px, 88vw);
      box-shadow: -8px 0 32px rgba(0,0,0,0.5);
    }
    #workspace.detail-overlay-open #graph-hud-bottom {
      right: calc(min(330px, 88vw) + 12px);
    }
    #workspace.sidebar-overlay-open #graph-hud-bottom {
      left: calc(min(300px, 85vw) + 12px);
    }
  }
  @media (max-width: 720px) {
    #header .stats { display: none; }
    #legend { display: none; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div class="header-left">
    <button class="pane-toggle" id="toggle-sidebar-btn" onclick="toggleSidebar()" title="Toggle Companies Panel">☰ Companies</button>
    <h1 id="app-title">Supply Chain Explorer</h1>
    <div class="index-switcher" role="tablist" aria-label="Select Market Index">
      <button class="index-tab active" data-index="nifty" onclick="switchIndex('nifty')">🇮🇳 Nifty 50</button>
      <button class="index-tab" data-index="nasdaq" onclick="switchIndex('nasdaq')">🇺🇸 Nasdaq-100</button>
      <button class="index-tab" data-index="combined" onclick="switchIndex('combined')">🌐 Combined</button>
    </div>
  </div>
  <div class="stats" id="header-stats"></div>
</div>

<!-- MAIN WORKSPACE -->
<div id="workspace">
  <!-- LEFT SIDEBAR -->
  <div id="sidebar">
    <div id="search-box">
      <input type="text" id="search-input" placeholder="Search companies, listed or unlisted vendors...">
    </div>
    <div id="sector-filters"></div>
    <div id="filter-row">
      <select id="rel-type-select" title="Filter by Relationship Type">
        <option value="all">All Relationships</option>
        <option value="supplier">Suppliers / Mfg</option>
        <option value="partner">Partners / Tech</option>
        <option value="customer">Channels / Buyers</option>
        <option value="logistics">Logistics / 3PL</option>
        <option value="subsidiary">JVs / Subsidiaries</option>
      </select>
      <select id="listing-filter-select" title="Filter by Listing Status"></select>
    </div>
    <div id="company-list"></div>
  </div>

  <!-- GRAPH -->
  <div id="graph-container">
    <svg id="graph-svg"></svg>
    <div id="graph-hud-bottom">
      <div id="legend"></div>
      <div id="graph-controls">
        <button class="ctrl-btn" id="color-mode-btn" onclick="toggleColorMode()" title="Switch between Listing Status and Sector colors">Color: Status</button>
        <button class="ctrl-btn" onclick="zoomBy(1.3)" title="Zoom In">+</button>
        <button class="ctrl-btn" onclick="zoomBy(0.77)" title="Zoom Out">−</button>
        <button class="ctrl-btn" onclick="fitAllOrFiltered()" title="Fit to View">Fit</button>
        <button class="ctrl-btn" onclick="resetView()" title="Reset All Filters">Reset</button>
        <button class="ctrl-btn" id="label-toggle-btn" onclick="toggleLabels()" title="Toggle Node Labels">Aa</button>
      </div>
    </div>
  </div>

  <!-- RIGHT DETAIL PANEL -->
  <div id="detail-panel">
    <div class="detail-topbar">
      <span>Company Inspector</span>
      <button class="close-detail-btn" onclick="toggleDetailPanel(false)" title="Close Panel">×</button>
    </div>
    <div id="detail-content"></div>
  </div>
</div>

<!-- TOOLTIP -->
<div id="tooltip">
  <div class="tt-name"></div>
  <div class="tt-info"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  SECTOR PALETTE
// ════════════════════════════════════════════════════════════
const SECTOR_COLORS = {
  // Nifty 50 sectors
  "Financial Services": "#3b82f6",
  "Information Technology": "#06b6d4",
  "Oil, Gas & Energy": "#f97316",
  "Automobile & Auto Components": "#ef4444",
  "FMCG": "#10b981",
  "Healthcare & Pharma": "#ec4899",
  "Metals & Mining": "#8b5cf6",
  "Capital Goods & Construction": "#f59e0b",
  "Telecom": "#6366f1",
  "Power": "#eab308",
  "Consumer Durables & Retail": "#14b8a6",
  "Services & Aviation": "#a855f7",
  "Technology Partners": "#06b6d4",
  "Logistics": "#64748b",
  "Chemicals & Packaging": "#84cc16",
  // Nasdaq-100 sectors
  "Semiconductors & Hardware": "#ef4444",
  "Cloud, AI & Software": "#06b6d4",
  "Consumer Tech & Media": "#8b5cf6",
  "Cybersecurity": "#f43f5e",
  "Healthcare & Biotech": "#ec4899",
  "Retail & E-Commerce": "#10b981",
  "Food & Beverage": "#84cc16",
  "Auto & Mobility": "#f97316",
  "Industrials & Aerospace": "#f59e0b",
  "Energy & Utilities": "#eab308",
  "Logistics & Telecom": "#6366f1",
  "Payments & Business Services": "#3b82f6",
};

function getSectorColor(sector) {
  return SECTOR_COLORS[sector] || "#64748b";
}

// ════════════════════════════════════════════════════════════
//  DATASET 1: NIFTY 50 (50 Anchors + 121 Suppliers + 276 Links)
// ════════════════════════════════════════════════════════════
const niftyAnchorsRaw = [
  { id: "HDFCBANK", name: "HDFC Bank", sector: "Financial Services", symbol: "HDFCBANK", exchange: "NSE" },
  { id: "ICICIBANK", name: "ICICI Bank", sector: "Financial Services", symbol: "ICICIBANK", exchange: "NSE" },

  { source: "VISA", target: "BKNG", type: "partner", label: "Travel card payments" },
];

// ════════════════════════════════════════════════════════════
//  DATASET BUILDERS FOR MODES: nifty | nasdaq | combined
// ════════════════════════════════════════════════════════════
const COMBINED_ALIASES = {
  AWS: "AMZN",
  MSFT_AZURE: "MSFT",
  GOOGLE: "GOOGL",
  QUALCOMM: "QCOM",
  ADOBE_G: "ADBE",
  INTEL_G: "INTC",
  INTUITIVE_SURG: "ISRG",
  GE_HEALTHCARE: "GEHC",
  TATACONSUM_S: "TATACONSUM",
  NOKIA_NW: "NOKIA",
};

function buildDataset(mode) {
  if (mode === "nifty") {
    const nodes = [
      ...niftyAnchorsRaw.map(c => ({ ...c, group: "nifty" })),
      ...niftySupplyRaw.map(c => ({ ...c, group: c.global ? "global" : (c.listed ? "listed" : "unlisted") }))
    ];
    return {
      mode: "nifty",
      title: "Nifty 50 Supply Chain Explorer",
      searchPlaceholder: "Search Nifty 50, listed or unlisted companies...",
      emptyMsg: "Click any Nifty 50 anchor node, listed/unlisted supplier, or sidebar item to inspect upstream vendors, subsidiaries, logistics, and downstream links.",
      nodes,
      links: niftyLinksRaw.map(l => ({ ...l })),
      anchorGroups: ["nifty"],
      groupMeta: {
        nifty: { label: "Nifty 50", shortLabel: "Nifty 50", color: "#3b82f6", tagClass: "tag-nifty", radius: 16 },
        listed: { label: "Listed (India)", shortLabel: "Listed", color: "#10b981", tagClass: "tag-listed", radius: 8.5 },
        unlisted: { label: "Unlisted / Private", shortLabel: "Unlisted", color: "#f59e0b", tagClass: "tag-unlisted", radius: 8.5 },
        global: { label: "Global", shortLabel: "Global", color: "#8b5cf6", tagClass: "tag-intl", radius: 10 },
      },
      statusOrder: ["nifty", "listed", "unlisted", "global"],
      listingDropdown: [
        { value: "all", label: "All Listing Types" },
        { value: "listed", label: "Listed (India)" },
        { value: "unlisted", label: "Unlisted / Private" },
        { value: "global", label: "Global Partners" },
      ],
      interLabel: "Inter-Nifty",
    };
  }

  if (mode === "nasdaq") {
    const nodes = [
      ...nasdaqAnchorsRaw.map(c => ({ ...c, group: "ndx" })),
      ...nasdaqSupplyRaw.map(c => ({ ...c, group: c.listing }))
    ];
    return {
      mode: "nasdaq",
      title: "Nasdaq-100 Supply Chain Explorer",
      searchPlaceholder: "Search Nasdaq-100, listed or private vendors...",
      emptyMsg: "Click any Nasdaq-100 anchor node, listed US/global supplier, or private/unlisted vendor to explore upstream manufacturing, cloud alliances, logistics, and downstream buyers.",
      nodes,
      links: nasdaqLinksRaw.map(l => ({ ...l })),
      anchorGroups: ["ndx"],
      groupMeta: {
        ndx: { label: "Nasdaq-100", shortLabel: "NDX-100", color: "#3b82f6", tagClass: "tag-ndx", radius: 14 },
        listed_us: { label: "Listed (US)", shortLabel: "US Listed", color: "#10b981", tagClass: "tag-listed", radius: 8.5 },
        listed_intl: { label: "Listed (Intl)", shortLabel: "Intl Listed", color: "#8b5cf6", tagClass: "tag-intl", radius: 9.5 },
        unlisted: { label: "Unlisted / Private", shortLabel: "Unlisted", color: "#f59e0b", tagClass: "tag-unlisted", radius: 8.5 },
      },
      statusOrder: ["ndx", "listed_us", "listed_intl", "unlisted"],
      listingDropdown: [
        { value: "all", label: "All Listing Types" },
        { value: "listed_us", label: "Listed (US)" },
        { value: "listed_intl", label: "Listed (Intl)" },
        { value: "unlisted", label: "Unlisted / Private" },
      ],
      interLabel: "Inter-NDX",
    };
  }

  // COMBINED MODE: unify both indices + deduplicate overlapping entities
  const nodeById = new Map();
  // Anchors take precedence
  niftyAnchorsRaw.forEach(c => nodeById.set(c.id, { ...c, group: "nifty" }));
  nasdaqAnchorsRaw.forEach(c => nodeById.set(c.id, { ...c, group: "ndx" }));

  // Add supply nodes unless aliased or already present as an anchor
  const addSupplyNode = (c, isUnlisted) => {
    const canonId = COMBINED_ALIASES[c.id] || c.id;
    if (nodeById.has(canonId)) return;
    nodeById.set(canonId, {
      ...c,
      id: canonId,
      group: isUnlisted ? "unlisted" : "listed"
    });
  };
  niftySupplyRaw.forEach(c => addSupplyNode(c, !c.listed));
  nasdaqSupplyRaw.forEach(c => addSupplyNode(c, c.listing === "unlisted"));

  // Merge links using canonical IDs and deduplicate identical edges
  const linkSet = new Set();
  const mergedLinks = [];
  const pushLink = (l) => {
    const s = COMBINED_ALIASES[l.source] || l.source;
    const t = COMBINED_ALIASES[l.target] || l.target;
    if (s === t) return;
    const key = `${s}|${t}|${l.type}`;
    if (linkSet.has(key)) return;
    linkSet.add(key);
    mergedLinks.push({ source: s, target: t, type: l.type, label: l.label });
  };
  niftyLinksRaw.forEach(pushLink);
  nasdaqLinksRaw.forEach(pushLink);
  // Cross-group subsidiary bridges
  pushLink({ source: "BOSCH", target: "BOSCH_GMBH", type: "subsidiary", label: "Indian listed subsidiary" });
  pushLink({ source: "HONEYWELL_UOP", target: "HON", type: "subsidiary", label: "Refining tech subsidiary" });

  return {
    mode: "combined",
    title: "Global Supply Chain Explorer",
    searchPlaceholder: "Search Nifty 50, Nasdaq-100, listed or private...",
    emptyMsg: "Explore the combined Nifty 50 & Nasdaq-100 supply web. Click shared hubs like Amazon, Microsoft, Alphabet, Qualcomm, or Tata Consumer to trace cross-market links.",
    nodes: Array.from(nodeById.values()),
    links: mergedLinks,
    anchorGroups: ["nifty", "ndx"],
    groupMeta: {
      nifty: { label: "Nifty 50", shortLabel: "Nifty 50", color: "#3b82f6", tagClass: "tag-nifty", radius: 14.5 },
      ndx: { label: "Nasdaq-100", shortLabel: "NDX-100", color: "#06b6d4", tagClass: "tag-ndx", radius: 13.5 },
      listed: { label: "Listed Suppliers", shortLabel: "Listed", color: "#10b981", tagClass: "tag-listed", radius: 8.5 },
      unlisted: { label: "Unlisted / Private", shortLabel: "Unlisted", color: "#f59e0b", tagClass: "tag-unlisted", radius: 8.5 },
    },
    statusOrder: ["nifty", "ndx", "listed", "unlisted"],
    listingDropdown: [
      { value: "all", label: "All Listing Types" },
      { value: "nifty", label: "Nifty 50 Anchors" },
      { value: "ndx", label: "Nasdaq-100 Anchors" },
      { value: "listed", label: "Listed Suppliers" },
      { value: "unlisted", label: "Unlisted / Private" },
    ],
    interLabel: "Cross-Index",
  };
}

// ════════════════════════════════════════════════════════════
//  INTERACTIVE APPLICATION CONTROLLER
// ════════════════════════════════════════════════════════════

let currentMode = "nifty";
let currentData = null;
let nodeMap = new Map();
let simulation = null;
let linkSel = null;
let nodeSel = null;
let showLabels = true;
let colorMode = "status";
let selectedNode = null;
let activeSectorFilters = new Set(["all"]);
let activeStatusFilter = "all";
let activeRelType = "all";
let userInteracted = false;

const graphContainer = document.getElementById("graph-container");
const svg = d3.select("#graph-svg");
const defs = svg.append("defs");

const markerColors = {
  supplier: "#3b82f6",
  subsidiary: "#f59e0b",
  partner: "#8b5cf6",
  logistics: "#64748b",
  customer: "#ec4899",
  interanchor: "#6366f1"
};
Object.entries(markerColors).forEach(([key, color]) => {
  defs.append("marker")
    .attr("id", `arrow-${key}`)
    .attr("viewBox", "0 -4 8 8")
    .attr("refX", 17)
    .attr("refY", 0)
    .attr("markerWidth", 5)
    .attr("markerHeight", 5)
    .attr("orient", "auto")
    .append("path")
    .attr("d", "M0,-4L8,0L0,4")
    .attr("fill", color)
    .attr("opacity", 0.8);
});

const g = svg.append("g");
const zoom = d3.zoom()
  .scaleExtent([0.1, 5])
  .on("zoom", (event) => g.attr("transform", event.transform));
svg.call(zoom);
svg.on("mousedown.track touchstart.track wheel.track", () => { userInteracted = true; });
svg.on("click", () => { if (selectedNode) clearSelection(); });

const tooltip = document.getElementById("tooltip");

function getGraphSize() {
  return {
    width: Math.max(graphContainer.clientWidth || 600, 200),
    height: Math.max(graphContainer.clientHeight || 500, 200)
  };
}

function isAnchorNode(d) {
  return currentData.anchorGroups.includes(d.group);
}

function nodeRadius(d) {
  return (currentData.groupMeta[d.group] || { radius: 8.5 }).radius;
}

function nodeColor(d) {
  if (colorMode === "sector") return getSectorColor(d.sector);
  return (currentData.groupMeta[d.group] || { color: "#64748b" }).color;
}

function nodeStroke(d) {
  if (isAnchorNode(d)) return colorMode === "status" ? getSectorColor(d.sector) : "#93c5fd";
  return d3.color(nodeColor(d)).brighter(0.6);
}

function linkCategory(l) {
  const s = typeof l.source === "object" ? l.source : nodeMap.get(l.source);
  const t = typeof l.target === "object" ? l.target : nodeMap.get(l.target);
  if (s && t && isAnchorNode(s) && isAnchorNode(t)) return "interanchor";
  return l.type || "supplier";
}

function linkColor(l) {
  return markerColors[linkCategory(l)] || "#3b82f6";
}

function getConnectionCount(id) {
  return currentData.links.filter(l => {
    const sid = typeof l.source === "object" ? l.source.id : l.source;
    const tid = typeof l.target === "object" ? l.target.id : l.target;
    return sid === id || tid === id;
  }).length;
}

function switchIndex(mode) {
  if (!["nifty", "nasdaq", "combined"].includes(mode)) mode = "nifty";
  currentMode = mode;

  // Update URL hash cleanly without adding noisy history entries
  if (window.location.hash !== "#" + mode) {
    history.replaceState(null, "", "#" + mode);
  }

  // Update switcher tab UI
  document.querySelectorAll(".index-tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.index === mode);
  });

  // Stop existing simulation & clear graph layers
  if (simulation) simulation.stop();
  g.selectAll("*").remove();

  // Reset filters & selection
  selectedNode = null;
  userInteracted = false;
  activeSectorFilters = new Set(["all"]);
  activeStatusFilter = "all";
  activeRelType = "all";
  document.getElementById("search-input").value = "";
  document.getElementById("rel-type-select").value = "all";

  // Build fresh dataset
  currentData = buildDataset(mode);
  nodeMap = new Map(currentData.nodes.map(n => [n.id, n]));

  // Update texts & title
  document.title = currentData.title;
  document.getElementById("app-title").textContent = currentData.title;
  document.getElementById("search-input").placeholder = currentData.searchPlaceholder;

  // Render Header Stats
  const counts = {};
  currentData.statusOrder.forEach(k => { counts[k] = 0; });
  currentData.nodes.forEach(n => { counts[n.group] = (counts[n.group] || 0) + 1; });

  const statsEl = document.getElementById("header-stats");
  statsEl.innerHTML = currentData.statusOrder.map(k => {
    const m = currentData.groupMeta[k];
    return `<span class="stat-pill" data-status="${k}" onclick="toggleStatusFilter('${k}')"><span class="dot" style="background:${m.color}"></span> <span>${counts[k]}</span> ${m.label}</span>`;
  }).join("") +
    `<span class="stat-pill static"><span class="dot" style="background:var(--text-muted)"></span> <span>${currentData.links.length}</span> Links</span>` +
    `<button class="pane-toggle" id="toggle-detail-btn" onclick="toggleDetailPanel()" title="Toggle Detail Panel">Details</button>`;

  // Render Listing Dropdown
  const listSel = document.getElementById("listing-filter-select");
  listSel.innerHTML = currentData.listingDropdown.map(o => `<option value="${o.value}">${o.label}</option>`).join("");
  listSel.value = "all";

  // Render Legend
  const legendEl = document.getElementById("legend");
  legendEl.innerHTML = currentData.statusOrder.map(k => {
    const m = currentData.groupMeta[k];
    return `<div class="legend-item"><div class="legend-dot" style="background:${m.color}"></div> ${m.label}</div>`;
  }).join("") + `
    <div class="legend-item"><div class="legend-line" style="background:var(--accent)"></div> Supply</div>
    <div class="legend-item"><div class="legend-line" style="border-top:2px dashed var(--amber); height:0"></div> JV / Sub</div>
    <div class="legend-item"><div class="legend-line" style="background:#6366f1"></div> ${currentData.interLabel}</div>
  `;

  // Render Sector Filter Pills
  const anchors = currentData.nodes.filter(isAnchorNode);
  const sectors = [...new Set(anchors.map(c => c.sector))].sort();
  const sf = document.getElementById("sector-filters");
  sf.innerHTML = `<button class="sector-btn active" data-sector="all">All Sectors</button>` +
    sectors.map(s => `<button class="sector-btn" data-sector="${s}" style="border-color:${getSectorColor(s)}55">${s}</button>`).join("");
  sf.scrollTop = 0;

  // Render Empty Detail Panel & Sidebar List
  clearSelection(true);
  renderCompanyList(true);

  // Build D3 Simulation
  const { width, height } = getGraphSize();
  const isCombined = mode === "combined";
  simulation = d3.forceSimulation(currentData.nodes)
    .alphaDecay(isCombined ? 0.032 : 0.025)
    .force("link", d3.forceLink(currentData.links).id(d => d.id).distance(d => {
      const s = typeof d.source === "object" ? d.source : nodeMap.get(d.source);
      const t = typeof d.target === "object" ? d.target : nodeMap.get(d.target);
      if (s && t && isAnchorNode(s) && isAnchorNode(t)) return isCombined ? 185 : 165;
      return isCombined ? 105 : 95;
    }).strength(0.45))
    .force("charge", d3.forceManyBody().strength(d => isAnchorNode(d) ? (isCombined ? -310 : -350) : -125))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collision", d3.forceCollide().radius(d => nodeRadius(d) + 7))
    .force("x", d3.forceX(width / 2).strength(0.035))
    .force("y", d3.forceY(height / 2).strength(0.035));

  linkSel = g.append("g")
    .selectAll("line")
    .data(currentData.links)
    .join("line")
    .attr("class", "link")
    .attr("stroke", linkColor)
    .attr("stroke-width", d => linkCategory(d) === "interanchor" ? 1.7 : 1.1)
    .attr("stroke-dasharray", d => d.type === "subsidiary" ? "4,3" : null)
    .attr("marker-end", d => `url(#arrow-${linkCategory(d)})`);

  nodeSel = g.append("g")
    .selectAll("g")
    .data(currentData.nodes)
    .join("g")
    .attr("class", "node")
    .call(d3.drag()
      .on("start", dragStarted)
      .on("drag", dragged)
      .on("end", dragEnded));

  nodeSel.append("circle")
    .attr("r", nodeRadius)
    .attr("fill", nodeColor)
    .attr("stroke", nodeStroke)
    .attr("stroke-width", d => isAnchorNode(d) ? 2.4 : 1.4)
    .on("mouseover", handleMouseOver)
    .on("mouseout", handleMouseOut)
    .on("click", (event, d) => {
      event.stopPropagation();
      selectNode(d.id);
    });

  nodeSel.append("text")
    .attr("dy", d => nodeRadius(d) + 11)
    .text(d => isAnchorNode(d) ? d.symbol : (d.name.length > 18 ? d.name.substring(0, 16) + "…" : d.name))
    .style("font-size", d => isAnchorNode(d) ? "9.5px" : "7.5px")
    .style("font-weight", d => isAnchorNode(d) ? "700" : "400")
    .style("fill", d => isAnchorNode(d) ? "#e2e8f0" : "#94a3b8")
    .style("display", () => showLabels ? "block" : "none");

  simulation.on("tick", () => {
    linkSel
      .attr("x1", d => d.source.x)
      .attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x)
      .attr("y2", d => d.target.y);
    nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
  });

  simulation.on("end", () => {
    if (!selectedNode && !userInteracted) fitNodesToView(null);
  });

  setTimeout(() => {
    if (!selectedNode && !userInteracted && currentMode === mode) fitNodesToView(null);
  }, 700);
}

// ── SECTOR & DROPDOWN EVENTS ──
document.getElementById("sector-filters").addEventListener("click", e => {
  if (!e.target.classList.contains("sector-btn")) return;
  const sf = document.getElementById("sector-filters");
  const sector = e.target.dataset.sector;
  if (sector === "all") {
    activeSectorFilters = new Set(["all"]);
    sf.querySelectorAll(".sector-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
  } else {
    activeSectorFilters.delete("all");
    sf.querySelector('[data-sector="all"]').classList.remove("active");
    if (activeSectorFilters.has(sector)) {
      activeSectorFilters.delete(sector);
      e.target.classList.remove("active");
      if (activeSectorFilters.size === 0) {
        activeSectorFilters.add("all");
        sf.querySelector('[data-sector="all"]').classList.add("active");
      }
    } else {
      activeSectorFilters.add(sector);
      e.target.classList.add("active");
    }
  }

  if (selectedNode) {
    const sel = nodeMap.get(selectedNode);
    if (sel && !activeSectorFilters.has("all") && !activeSectorFilters.has(sel.sector)) {
      clearSelection(true);
    }
  }

  renderCompanyList(true);
  const visibleNodes = updateGraphFilter();
  if (!selectedNode) fitNodesToView(visibleNodes);
});

document.getElementById("rel-type-select").addEventListener("change", e => {
  activeRelType = e.target.value;
  updateGraphFilter();
  if (selectedNode) highlightConnections(selectedNode);
});

document.getElementById("listing-filter-select").addEventListener("change", e => {
  setStatusFilter(e.target.value);
});

document.getElementById("search-input").addEventListener("input", () => {
  renderCompanyList(true);
  updateGraphFilter();
});

function toggleStatusFilter(status) {
  setStatusFilter(activeStatusFilter === status ? "all" : status);
}

function setStatusFilter(status) {
  activeStatusFilter = status;
  document.querySelectorAll(".stat-pill[data-status]").forEach(el => {
    el.classList.toggle("active-status", el.dataset.status === status);
  });
  const sel = document.getElementById("listing-filter-select");
  if (Array.from(sel.options).some(o => o.value === status)) {
    sel.value = status;
  } else {
    sel.value = "all";
  }
  renderCompanyList(true);
  const visibleNodes = updateGraphFilter();
  if (!selectedNode) fitNodesToView(visibleNodes);
}

// ── SIDEBAR COMPANY LIST ──
function renderCompanyList(resetScroll = false) {
  const containerEl = document.getElementById("company-list");
  const search = document.getElementById("search-input").value.trim().toLowerCase();

  const anchors = currentData.nodes.filter(isAnchorNode);
  const supplies = currentData.nodes.filter(n => !isAnchorNode(n));

  let html = "";
  // Render each anchor group section
  currentData.anchorGroups.forEach(grp => {
    if (activeStatusFilter !== "all" && activeStatusFilter !== grp) return;
    const filtered = anchors.filter(c => {
      if (c.group !== grp) return false;
      const matchSector = activeSectorFilters.has("all") || activeSectorFilters.has(c.sector);
      const matchSearch = !search || c.name.toLowerCase().includes(search) || c.symbol.toLowerCase().includes(search) || c.sector.toLowerCase().includes(search);
      return matchSector && matchSearch;
    });
    if (filtered.length > 0) {
      const m = currentData.groupMeta[grp];
      html += `<div class="list-section-header">${m.label} Anchors (${filtered.length})</div>`;
      html += filtered.map(c => `
        <div class="company-item ${selectedNode === c.id ? 'active' : ''}" data-id="${c.id}" onclick="selectNode('${c.id}')">
          <div class="icon" style="background:${getSectorColor(c.sector)}22;color:${getSectorColor(c.sector)}">
            ${c.symbol.substring(0, 3)}
          </div>
          <div class="info">
            <div class="name">${c.name}</div>
            <div class="sector-label">${c.symbol} • ${c.sector}</div>
          </div>
          <div class="badge">${getConnectionCount(c.id)}</div>
        </div>
      `).join("");
    }
  });

  // Render matching non-anchor supply chain companies when searching or filtering by supply status
  const isSupplyStatus = !currentData.anchorGroups.includes(activeStatusFilter) && activeStatusFilter !== "all";
  if (search || isSupplyStatus) {
    const matchingSupply = supplies.filter(c => {
      const matchStatus = activeStatusFilter === "all" || activeStatusFilter === c.group;
      const matchSector = activeSectorFilters.has("all") || activeSectorFilters.has(c.sector);
      const matchSearch = !search || c.name.toLowerCase().includes(search) || (c.desc && c.desc.toLowerCase().includes(search));
      return matchStatus && matchSector && matchSearch;
    });
    if (matchingSupply.length > 0) {
      const hdr = isSupplyStatus ? currentData.groupMeta[activeStatusFilter].label : "Supply Chain Matches";
      html += `<div class="list-section-header">${hdr} (${matchingSupply.length})</div>`;
      html += matchingSupply.map(c => {
        const m = currentData.groupMeta[c.group];
        return `
          <div class="company-item ${selectedNode === c.id ? 'active' : ''}" data-id="${c.id}" onclick="selectNode('${c.id}')">
            <div class="icon" style="background:${m.color}22;color:${m.color}">
              ${c.name.substring(0, 2).toUpperCase()}
            </div>
            <div class="info">
              <div class="name">${c.name}</div>
              <div class="sector-label">${m.shortLabel} • ${c.sector}</div>
            </div>
            <div class="badge">${getConnectionCount(c.id)}</div>
          </div>
        `;
      }).join("");
    }
  }

  if (!html) {
    html = `<div style="padding:24px 16px;text-align:center;color:var(--text-muted);font-size:12px;">No matching companies found.</div>`;
  }

  containerEl.innerHTML = html;
  if (resetScroll) containerEl.scrollTop = 0;
}

// ── TOOLTIP ──
function handleMouseOver(event, d) {
  tooltip.style.display = "block";
  tooltip.querySelector(".tt-name").textContent = d.name;
  const m = currentData.groupMeta[d.group];
  const info = [d.sector, m ? m.label : ""];
  if (d.desc) info.push(d.desc);
  tooltip.querySelector(".tt-info").textContent = info.filter(Boolean).join(" • ");

  const x = Math.min(event.clientX + 16, window.innerWidth - 285);
  const y = Math.min(event.clientY - 12, window.innerHeight - 105);
  tooltip.style.left = x + "px";
  tooltip.style.top = Math.max(8, y) + "px";
}

function handleMouseOut() {
  tooltip.style.display = "none";
}

function syncOverlayClasses() {
  const ws = document.getElementById("workspace");
  const isNarrow = window.innerWidth <= 1050;
  const sbOpen = !document.getElementById("sidebar").classList.contains("collapsed");
  const dpOpen = !document.getElementById("detail-panel").classList.contains("collapsed");
  ws.classList.toggle("sidebar-overlay-open", isNarrow && sbOpen);
  ws.classList.toggle("detail-overlay-open", isNarrow && dpOpen);
}

// ── NODE SELECTION & CAMERA ──
function selectNode(id) {
  userInteracted = true;
  selectedNode = id;
  const d = nodeMap.get(id);
  if (!d) return;

  const dp = document.getElementById("detail-panel");
  if (dp.classList.contains("collapsed")) dp.classList.remove("collapsed");
  if (window.innerWidth <= 1050) document.getElementById("sidebar").classList.add("collapsed");
  syncOverlayClasses();

  renderCompanyList(false);
  highlightConnections(id);
  renderDetailPanel(d);

  const targetNode = currentData.nodes.find(n => n.id === id);
  if (targetNode && targetNode.x != null) {
    const { width, height } = getGraphSize();
    const overlayRight = (window.innerWidth <= 1050 && !dp.classList.contains("collapsed")) ? Math.min(330, window.innerWidth * 0.88) : 0;
    const visibleWidth = Math.max(width - overlayRight, 180);
    const transform = d3.zoomTransform(svg.node());
    const scale = Math.max(transform.k, 1.1);
    const tx = visibleWidth / 2 - targetNode.x * scale;
    const ty = height / 2 - targetNode.y * scale;
    svg.transition().duration(480).call(
      zoom.transform,
      d3.zoomIdentity.translate(tx, ty).scale(scale)
    );
  }
}

function fitNodesToView(targetIds) {
  if (!currentData) return;
  const subset = targetIds && targetIds.size > 0
    ? currentData.nodes.filter(n => targetIds.has(n.id) && n.x != null)
    : currentData.nodes.filter(n => n.x != null);
  if (subset.length === 0) return;

  const { width, height } = getGraphSize();
  const xs = subset.map(n => n.x);
  const ys = subset.map(n => n.y);
  const minX = Math.min(...xs) - 55;
  const maxX = Math.max(...xs) + 55;
  const minY = Math.min(...ys) - 55;
  const maxY = Math.max(...ys) + 55;
  const dx = Math.max(maxX - minX, 120);
  const dy = Math.max(maxY - minY, 120);
  const scale = Math.min(1.5, Math.max(0.16, 0.85 / Math.max(dx / width, dy / height)));
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const tx = width / 2 - cx * scale;
  const ty = height / 2 - cy * scale;

  svg.transition().duration(520).call(
    zoom.transform,
    d3.zoomIdentity.translate(tx, ty).scale(scale)
  );
}

function highlightConnections(id) {
  const connectedIds = new Set([id]);
  const connectedLinks = new Set();

  currentData.links.forEach((l, i) => {
    if (activeRelType !== "all" && l.type !== activeRelType) return;
    const sid = typeof l.source === "object" ? l.source.id : l.source;
    const tid = typeof l.target === "object" ? l.target.id : l.target;
    if (sid === id || tid === id) {
      connectedIds.add(sid);
      connectedIds.add(tid);
      connectedLinks.add(i);
    }
  });

  nodeSel.classed("highlighted", d => d.id === id)
    .classed("dimmed", d => !connectedIds.has(d.id))
    .style("opacity", null);
  linkSel.classed("highlighted", (d, i) => connectedLinks.has(i))
    .classed("dimmed", (d, i) => !connectedLinks.has(i))
    .style("opacity", null);
}

function clearHighlight() {
  if (!nodeSel || !linkSel) return;
  nodeSel.classed("highlighted", false).classed("dimmed", false);
  linkSel.classed("highlighted", false).classed("dimmed", false);
}

function getStatusBadgeHtml(d) {
  const m = currentData.groupMeta[d.group] || { tagClass: "tag-listed", label: d.group };
  return `<span class="detail-tag ${m.tagClass}">${m.label}</span>`;
}

function getShortStatusBadge(d) {
  const m = currentData.groupMeta[d.group] || { tagClass: "tag-listed", shortLabel: d.group };
  return `<span class="sc-status ${m.tagClass}">${m.shortLabel}</span>`;
}

function renderDetailPanel(d) {
  const panel = document.getElementById("detail-content");

  const relatedLinks = currentData.links.filter(l => {
    const sid = typeof l.source === "object" ? l.source.id : l.source;
    const tid = typeof l.target === "object" ? l.target.id : l.target;
    return sid === d.id || tid === d.id;
  });

  const upstreamSuppliers = [];
  const downstreamCustomers = [];
  const subsidiaries = [];
  const parentGroups = [];
  const partners = [];
  const logisticsProviders = [];
  const logisticsClients = [];

  relatedLinks.forEach(l => {
    const sid = typeof l.source === "object" ? l.source.id : l.source;
    const tid = typeof l.target === "object" ? l.target.id : l.target;
    const isIncoming = tid === d.id;
    const otherId = isIncoming ? sid : tid;
    const other = nodeMap.get(otherId);
    if (!other) return;
    const item = { ...other, linkLabel: l.label, linkType: l.type };

    if (l.type === "supplier") {
      if (isIncoming) upstreamSuppliers.push(item);
      else downstreamCustomers.push(item);
    } else if (l.type === "customer") {
      if (!isIncoming) downstreamCustomers.push(item);
      else upstreamSuppliers.push(item);
    } else if (l.type === "subsidiary") {
      if (isIncoming) subsidiaries.push(item);
      else parentGroups.push(item);
    } else if (l.type === "logistics") {
      if (isIncoming) logisticsProviders.push(item);
      else logisticsClients.push(item);
    } else if (l.type === "partner") {
      partners.push(item);
    }
  });

  function renderSection(title, items) {
    if (items.length === 0) return "";
    return `
      <div class="detail-section">
        <h3>${title} (${items.length})</h3>
        ${items.map(it => `
          <div class="supply-chain-item" onclick="selectNode('${it.id}')">
            <div class="sc-dot" style="background:${nodeColor(it)}"></div>
            <div class="sc-main">
              <div class="sc-name">${it.name}</div>
              <div class="sc-sub">${it.linkLabel || it.linkType}</div>
            </div>
            ${getShortStatusBadge(it)}
          </div>
        `).join("")}
      </div>
    `;
  }

  const exchangeLine = d.symbol ? ` • ${d.exchange || "Ticker"}: ${d.symbol}` : "";
  panel.innerHTML = `
    <div class="detail-header">
      <div class="detail-icon" style="background:${nodeColor(d)}22;color:${nodeColor(d)}">
        ${(d.symbol || d.name).substring(0, 3).toUpperCase()}
      </div>
      <div>
        <div class="detail-title">${d.name}</div>
        <div class="detail-subtitle">${d.sector}${exchangeLine}</div>
      </div>
    </div>
    <div class="detail-tags" style="margin-bottom:14px;">
      ${getStatusBadgeHtml(d)}
      <span class="detail-tag" style="background:${getSectorColor(d.sector)}20;color:${getSectorColor(d.sector)}">${d.sector}</span>
    </div>
    ${d.desc ? `<p style="font-size:12px;color:var(--text-secondary);margin-bottom:16px;line-height:1.5;">${d.desc}</p>` : ''}
    ${renderSection("Upstream Suppliers & Manufacturing", upstreamSuppliers)}
    ${renderSection("Subsidiaries & Joint Ventures", subsidiaries)}
    ${renderSection("Parent / Holding Group", parentGroups)}
    ${renderSection("Cloud, Tech & Strategic Partners", partners)}
    ${renderSection("Logistics & 3PL Providers", logisticsProviders)}
    ${renderSection("Supplies To / Downstream Buyers", [...downstreamCustomers, ...logisticsClients])}
    <div style="margin-top:18px;text-align:center;">
      <button onclick="clearSelection()" style="padding:7px 16px;border-radius:6px;background:var(--bg-card);border:1px solid #2b384e;color:var(--text-secondary);cursor:pointer;font-size:12px;">
        Clear Selection
      </button>
    </div>
  `;
}

function clearSelection(skipRenderList = false) {
  selectedNode = null;
  clearHighlight();
  updateGraphFilter();
  if (!skipRenderList) renderCompanyList(false);
  document.getElementById("detail-content").innerHTML = `
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/>
      </svg>
      <p>${currentData.emptyMsg}</p>
    </div>
  `;
}

function updateGraphFilter() {
  if (!currentData || !nodeSel || !linkSel) return null;
  const search = document.getElementById("search-input").value.trim().toLowerCase();
  const matchingSectors = activeSectorFilters.has("all") ? null : activeSectorFilters;
  const relType = activeRelType;
  const statusFilter = activeStatusFilter;

  linkSel.style("display", l => {
    if (relType !== "all" && l.type !== relType) return "none";
    return "block";
  });

  const hasFilter = Boolean(matchingSectors || search || statusFilter !== "all" || relType !== "all");
  if (!hasFilter) {
    if (!selectedNode) {
      nodeSel.style("opacity", 1);
      linkSel.style("opacity", 0.34);
    }
    return null;
  }

  let seedIds = new Set();
  if (matchingSectors) {
    const sectorAnchors = new Set(
      currentData.nodes.filter(c => isAnchorNode(c) && matchingSectors.has(c.sector)).map(c => c.id)
    );
    if (statusFilter === "all" && !search) {
      seedIds = sectorAnchors;
    } else {
      const sectorPool = new Set(sectorAnchors);
      currentData.links.forEach(l => {
        if (relType !== "all" && l.type !== relType) return;
        const sid = typeof l.source === "object" ? l.source.id : l.source;
        const tid = typeof l.target === "object" ? l.target.id : l.target;
        if (sectorAnchors.has(sid)) sectorPool.add(tid);
        if (sectorAnchors.has(tid)) sectorPool.add(sid);
      });
      sectorPool.forEach(id => {
        const n = nodeMap.get(id);
        if (!n) return;
        const okStatus = statusFilter === "all" || n.group === statusFilter;
        const okSearch = !search || n.name.toLowerCase().includes(search) ||
          (n.symbol && n.symbol.toLowerCase().includes(search)) ||
          (n.desc && n.desc.toLowerCase().includes(search));
        if (okStatus && okSearch) seedIds.add(id);
      });
    }
  } else {
    currentData.nodes.forEach(n => {
      const okStatus = statusFilter === "all" || n.group === statusFilter;
      const okSearch = !search || n.name.toLowerCase().includes(search) ||
        (n.symbol && n.symbol.toLowerCase().includes(search)) ||
        (n.desc && n.desc.toLowerCase().includes(search));
      if (okStatus && okSearch) seedIds.add(n.id);
    });
  }

  const visibleNodeIds = new Set(seedIds);
  currentData.links.forEach(l => {
    if (relType !== "all" && l.type !== relType) return;
    const sid = typeof l.source === "object" ? l.source.id : l.source;
    const tid = typeof l.target === "object" ? l.target.id : l.target;
    if (seedIds.has(sid)) visibleNodeIds.add(tid);
    if (seedIds.has(tid)) visibleNodeIds.add(sid);
  });

  if (!selectedNode) {
    nodeSel.style("opacity", d => visibleNodeIds.has(d.id) ? 1 : 0.08);
    linkSel.style("opacity", l => {
      if (relType !== "all" && l.type !== relType) return 0;
      const sid = typeof l.source === "object" ? l.source.id : l.source;
      const tid = typeof l.target === "object" ? l.target.id : l.target;
      return visibleNodeIds.has(sid) && visibleNodeIds.has(tid) ? 0.55 : 0.025;
    });
  }

  return visibleNodeIds;
}

// ── CONTROLS & PANEL TOGGLES ──
function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("collapsed");
  if (window.innerWidth <= 1050) document.getElementById("detail-panel").classList.add("collapsed");
  syncOverlayClasses();
}

function toggleDetailPanel(forceState) {
  const dp = document.getElementById("detail-panel");
  if (typeof forceState === "boolean") dp.classList.toggle("collapsed", !forceState);
  else dp.classList.toggle("collapsed");
  if (window.innerWidth <= 1050 && !dp.classList.contains("collapsed")) {
    document.getElementById("sidebar").classList.add("collapsed");
  }
  syncOverlayClasses();
}

function zoomBy(factor) {
  userInteracted = true;
  svg.transition().duration(260).call(zoom.scaleBy, factor);
}

function fitAllOrFiltered() {
  const visible = updateGraphFilter();
  fitNodesToView(visible);
}

function resetView() {
  const sf = document.getElementById("sector-filters");
  activeSectorFilters = new Set(["all"]);
  sf.querySelectorAll(".sector-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.sector === "all");
  });
  document.getElementById("search-input").value = "";
  document.getElementById("rel-type-select").value = "all";
  activeRelType = "all";
  setStatusFilter("all");
  clearSelection();
  fitNodesToView(null);
}

function toggleLabels() {
  showLabels = !showLabels;
  if (nodeSel) nodeSel.selectAll("text").style("display", showLabels ? "block" : "none");
  document.getElementById("label-toggle-btn").classList.toggle("active-mode", showLabels);
}

function toggleColorMode() {
  colorMode = colorMode === "status" ? "sector" : "status";
  document.getElementById("color-mode-btn").textContent = colorMode === "status" ? "Color: Status" : "Color: Sector";
  document.getElementById("color-mode-btn").classList.toggle("active-mode", colorMode === "sector");
  if (nodeSel) {
    nodeSel.selectAll("circle")
      .attr("fill", nodeColor)
      .attr("stroke", nodeStroke);
  }
  if (selectedNode) renderDetailPanel(nodeMap.get(selectedNode));
}

// ── DRAG ──
function dragStarted(event, d) {
  if (!event.active && simulation) simulation.alphaTarget(0.12).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(event, d) {
  d.fx = event.x; d.fy = event.y;
}
function dragEnded(event, d) {
  if (!event.active && simulation) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// ── RESPONSIVE OBSERVER ──
function handleLayoutResize() {
  syncOverlayClasses();
  if (!simulation) return;
  const { width, height } = getGraphSize();
  simulation.force("center", d3.forceCenter(width / 2, height / 2));
  simulation.force("x", d3.forceX(width / 2).strength(0.035));
  simulation.force("y", d3.forceY(height / 2).strength(0.035));
  simulation.alpha(0.2).restart();
}

const resizeObserver = new ResizeObserver(() => handleLayoutResize());
resizeObserver.observe(graphContainer);

if (window.innerWidth <= 1050) document.getElementById("detail-panel").classList.add("collapsed");
if (window.innerWidth <= 720) document.getElementById("sidebar").classList.add("collapsed");
syncOverlayClasses();

document.getElementById("label-toggle-btn").classList.add("active-mode");

// Determine initial mode from URL hash (#nifty, #nasdaq, #combined)
const hashMode = window.location.hash.replace("#", "").toLowerCase();
const initialMode = ["nifty", "nasdaq", "combined"].includes(hashMode) ? hashMode : "nifty";
switchIndex(initialMode);
</script>
